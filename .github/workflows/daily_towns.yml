name: Daily Autonomous Mini Township Autopilot

on:
  schedule:
    # 06:00 UTC (11:30 AM IST) -> Mountain Village
    - cron: '0 6 * * *'
    # 12:00 UTC (05:30 PM IST) -> Smart City
    - cron: '0 12 * * *'
    # 17:00 UTC (10:30 PM IST) -> Desert Town
    - cron: '0 17 * * *'

  workflow_dispatch:
    inputs:
      town:
        description: 'Select Town Series to Generate & Upload'
        required: true
        default: 'smart_city'
        type: choice
        options:
          - 'smart_city'
          - 'mountain_village'
          - 'desert_town'
      dry_run:
        description: 'Dry Run Mode (render video without uploading)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  run-town-build:
    name: Generate & Upload Miniature Reel
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: npm ci

      - name: Determine Target Town Series
        id: select_town
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "town=${{ github.event.inputs.town }}" >> $GITHUB_OUTPUT
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +"%-H")
            case $HOUR in
              6)
                echo "town=mountain_village" >> $GITHUB_OUTPUT
                ;;
              12)
                echo "town=smart_city" >> $GITHUB_OUTPUT
                ;;
              17)
                echo "town=desert_town" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "town=smart_city" >> $GITHUB_OUTPUT
                ;;
            esac
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Township Autopilot Pipeline
        env:
          TOWN_KEY: ${{ steps.select_town.outputs.town }}
          DRY_RUN: ${{ steps.select_town.outputs.dry_run }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          echo "Starting autonomous run for: $TOWN_KEY (Dry Run: $DRY_RUN)"
          node src/index.js "$TOWN_KEY"

      - name: Commit & Push Updated Town Memory State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/town_memory.json state/last_frame_*.jpg || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(memory): save diorama continuity for ${{ steps.select_town.outputs.town }} [skip ci]"
          fi
          git push origin HEAD:main || git push || true
          echo "Town memory successfully synced to GitHub."

      - name: Archive Video & Thumbnail Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ steps.select_town.outputs.town }}-output
          path: |
            output/**/*.mp4
            output/**/*.jpg
            output/**/episode_plan.json
          retention-days: 14
